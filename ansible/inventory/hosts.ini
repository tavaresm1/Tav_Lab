# ---------------------------------------------------------------------------
# tav-serv — the Dell R610, running Proxmox VE. This is the only physical host
# the repo manages. It was Linux Mint + VirtualBox until the Proxmox rebuild;
# the Mint-era roles that targeted it have been retired (see
# docs/context/design-decisions.md).
#
# The control node runs on the tavares-lab workstation and reaches tav-serv and
# its guests over the tailnet. tav-serv is not in the inventory twice: one host,
# one connection, root over SSH.
# ---------------------------------------------------------------------------

# `tav-serv` here is an ALIAS, not a resolvable name. The box's own hostname —
# and therefore its PVE node name and its MagicDNS name — is `pve`; the installer
# set it during the Proxmox rebuild and renaming a live PVE node is not worth the
# risk. The alias keeps inventory/host_vars/tav-serv.yml and every doc reference working.
#
# ansible_host is the LAN address rather than a name on purpose: it is statically
# configured on vmbr0 (confirmed, not a DHCP lease), the workstation is on the
# same LAN, and it does not depend on MagicDNS
# surviving a corporate-VPN DNS flip (see docs/context/tailscale-topology.md).
# `pve` over MagicDNS works too when Tailscale is healthy.
[proxmox]
tav-serv ansible_host=192.168.1.226 ansible_user=root

# ---------------------------------------------------------------------------
# Autobase platform guests, hosted on tav-serv. See docs/autobase.md.
#
# Guest IPs are NOT repeated here — ansible_host is derived from the
# autobase_guests dict in inventory/group_vars/autobase.yml, which is the single place
# to edit addressing. See inventory/group_vars/autobase_guests.yml.
# ---------------------------------------------------------------------------

[autobase_console]
autobase-console

[pg_nodes]
pgnode01
pgnode02
pgnode03

# Every Ubuntu guest we provision (console + DB nodes).
[autobase_guests:children]
autobase_console
pg_nodes

# The whole platform, hypervisor included — scope for inventory/group_vars/autobase.yml.
[autobase:children]
proxmox
autobase_guests

[all:vars]
ansible_python_interpreter=/usr/bin/python3
