[hypervisors]
tav-serv ansible_host=tav-serv ansible_user=tavaresm1

# ---------------------------------------------------------------------------
# Autobase platform on the pve Proxmox host. See docs/autobase.md.
#
# Guest IPs are NOT repeated here — ansible_host is derived from the
# autobase_guests dict in group_vars/autobase.yml, which is the single place
# to edit addressing. See group_vars/autobase_guests.yml.
# ---------------------------------------------------------------------------

[proxmox]
pve ansible_host=pve ansible_user=root

[autobase_console]
autobase-console

[pg_nodes]
pgnode01
pgnode02
pgnode03

# Every Ubuntu guest we provision (console + DB nodes).
[autobase_guests:children]
autobase_console
pg_nodes

# The whole platform, hypervisor included — scope for group_vars/autobase.yml.
[autobase:children]
proxmox
autobase_guests

[all:vars]
ansible_python_interpreter=/usr/bin/python3
