---
# ============================================================================
# Autobase platform configuration — the ONE file to edit.
#
# Applies to the [autobase] group: tav-serv plus every Ubuntu guest on it.
# Runbook: docs/autobase.md
# ============================================================================

# ----------------------------------------------------------------------------
# FILL IN from Step 0 discovery (see docs/autobase.md §1). Every value below
# is a placeholder inferred from the documented lab LAN — confirm each one
# against tav-serv before the first run. The preflight asserts in
# playbooks/autobase.yml will stop the run if these are left at defaults
# while autobase_preflight_confirmed is false.
# ----------------------------------------------------------------------------

# Set to true once you have verified every value in this block.
#
# Flipped true 2026-09-19. What that confirmation actually rests on, honestly:
#   - pve_node / pve_api_host / pve_storage / pve_bridge: measured on the box
#   - pve_api_user / pve_api_token_id: the token exists (`ansible@pve!automation`,
#     created 2026-09-19 with PVEVMAdmin on / and PVEDatastoreUser on /storage)
#   - subnet / gateway: measured
#   - the five static addresses: verified unused by scan, NOT by reading the
#     router's DHCP pool — see the note above autobase_cluster_vip
#   - autobase_nameservers: still inferred, not measured
autobase_preflight_confirmed: true

# --- Proxmox node (the R610 we call tav-serv) ---
#
# CONFIRMED 2026-09-18 from `hostname`, `pvesm status`, `ip -br addr` on the box.
#
# The PVE node name is `pve`, NOT tav-serv. "tav-serv" is what we call the
# physical machine — it was the Mint-era hostname — but the Proxmox installer
# named the node `pve` and that is what the API, /etc/pve/nodes/ and every VM
# config key off. Do not "fix" this by renaming the node: a PVE node rename means
# moving /etc/pve/nodes/<name> and every guest config with the cluster filesystem
# live. `tav-serv` survives as the inventory alias only (see inventory/hosts.ini).
pve_node: pve                     # `pvesh get /nodes` — the node NAME
pve_api_host: 192.168.1.226       # host:8006 the API is reached on
pve_storage: local-lvm            # lvmthin, 844 GB free of 976 GB — plenty for 152 GB of guests
pve_bridge: vmbr0                 # UP, holds 192.168.1.226/24, enslaves nic1
pve_api_user: ansible@pve         # `@pve` is the PVE auth REALM here, not a hostname
pve_api_token_id: automation
pve_api_validate_certs: false     # PVE ships a self-signed cert

# --- Network ---
# CONFIRMED 2026-09-18: the lab LAN is 192.168.1.0/24 and tav-serv itself is
# 192.168.1.226 (the user SSHes to it there). This replaces the 192.168.0.0/24
# that earlier docs assumed — if you find that subnet anywhere else, it's stale.
autobase_subnet_cidr: 192.168.1.0/24
autobase_subnet_prefix: 24

# CONFIRMED 2026-09-18: `ip route show default` → default via 192.168.1.1 dev vmbr0
autobase_gateway: 192.168.1.1

# Checked 2026-09-19 — and the obvious check does NOT answer this. The host has no
# resolvectl (PVE/Debian here does not run systemd-resolved), and
# /etc/resolv.conf is owned by Tailscale:
#
#   nameserver 100.100.100.100                    <- MagicDNS, not the LAN resolver
#   search taild4e3f5.ts.net mynetworksettings.com
#
# So the host's own resolver is useless as a model for the guests: the guests are
# not on the tailnet (only the console VM joins it) and must not be pointed at
# 100.100.100.100.
#
# What that file does establish is the SEARCH DOMAIN. Tailscale prepends the
# tailnet domain and keeps whatever it found, so `mynetworksettings.com` is the
# LAN's own domain — a Verizon Fios router. It was `lan` here, which was a guess
# and wrong. To see the pre-Tailscale resolver directly:
#   cat /etc/resolv.pre-tailscale-backup.conf
autobase_nameservers:
  - 192.168.1.1
autobase_searchdomains:
  - mynetworksettings.com

# The single client entry point, owned by vip-manager and moved on failover.
# MUST be currently unused and outside the DHCP pool — Autobase validates this
# at deploy time and assigns it after the cluster is up.
#
# PARTIALLY CONFIRMED 2026-09-19. The subnet is 192.168.1.0/24; the DHCP POOL
# RANGE within it was never established. So .30/.40/.41-.43 are verified "nothing
# answers on them right now", which is not the same as "the router will never
# lease them". The residual risk is a duplicate-address collision weeks from now,
# when a new device gets a lease for .41 and a pgnode stops being reachable — a
# failure that looks like a Patroni or network fault and is neither.
#
# Close it one of two ways, either is fine:
#   - narrow the DHCP pool to start above .50 (router admin page), or
#   - add static DHCP reservations for these five addresses
#
# The playbook's preflight pings the VIP on every run, so a collision that has
# already happened will stop the run rather than corrupt anything. It cannot warn
# about a lease the router has merely reserved the right to hand out.
autobase_cluster_vip: 192.168.1.40

# --- Guests ---
# Single source of truth for VMIDs, sizing and addressing. Keys match
# inventory_hostname in [autobase_guests]; inventory/group_vars/autobase_guests.yml
# derives ansible_host from the `ip` field here.
#
# VMIDs CONFIRMED FREE 2026-09-18: `qm list` shows 100 (NAS), 101 (Kieran-Craft),
# 102 (Tav-Assistant), 103 (Hermes), 104 (KCraft-b, stopped). Nothing near 8000.
#
# RAM budget: 2048 + (3 x 2560) = 9728 MB resident.
#
# IT FITS — but only just, and the margin is worth understanding before you change
# any of these numbers.
#
# The box has 40,188 MB (measured, not the 24 GB the old docs claimed). The
# existing guests were trimmed on 2026-09-18 and now total 25,200 MB configured:
# NAS 8048, Kieran-Craft 8000 (was 16000), Tav-Assistant 4080 (was 8048), Hermes
# 4048 (was 18000), KCraft-b 1024 (was 8048). Plus our 9,728 = 34,928 MB of
# 40,188, leaving ~5.2 GB for PVE itself and the ZFS ARC.
#
# Two caveats:
#
#   - As measured, 25,669 MB was available — but only NAS was RUNNING. The 34,928
#     figure is the all-guests-running case, which is the one to plan against.
#   - At ARC's real 3.7 GB working set plus ~2 GB for PVE, the all-running case
#     lands right on 40 GB. The 8 GB zfs_arc_max cap in /etc/modprobe.d/zfs.conf
#     is therefore too generous for now — 4 GB is the right interim ceiling if you
#     intend to start everything at once before the RAM upgrade lands.
#
# A 96 GB upgrade is planned (stated 2026-09-18). Once it's in, all of this
# arithmetic stops mattering: 34,928 MB committed against 96 GB is comfortable,
# the 8 GB ARC cap becomes reasonable rather than greedy, and the trimmed guests
# can be given their memory back. Re-measure and simplify this block then.
# Both sockets turned out to be populated (24 vCPU reported 2026-09-19), so both
# DIMM banks are live and either route to 96 GB works —
# docs/context/upgrades-in-flight.md has them.
#
# What absorbs an overshoot: none of the pre-existing guests set a `balloon` key
# (verified 2026-09-18), so PVE can reclaim from all five under pressure, while
# the pgnodes below set `balloon: 0` and cannot be touched. That is the priority
# ordering we want — Minecraft yields pages, shared_buffers does not — with the
# 8 GB swap partition (currently untouched) as the backstop.
#
# The ZFS ARC was the obvious suspect for the original shortfall and was NOT the
# cause: measured at 3.7 GB, nowhere near its ~20 GB default ceiling. The RAM was
# genuinely in the guests. Don't go looking at ARC again.
#
# If it stops fitting before the RAM arrives, in order:
#   1. Shrink the platform: pgnodes to 2048, console to 1536 = 7,680 MB. Patroni,
#      etcd, PgBouncer and a 512 MB shared_buffers fit a lab cluster fine.
#   2. Enable ballooning on the pgnodes (memory as ceiling, balloon as floor) and
#      accept that reclaim under shared_buffers can produce latency cliffs.
#   3. Leave a guest or two stopped. Three of the five were stopped at measurement
#      time anyway.
#
# `playbooks/autobase.yml` asserts on ansible_memfree_mb, so it will refuse the
# run rather than overcommit silently — but it can only judge the moment it runs.
#
# balloon: 0 disables the balloon driver. Left off on the DB nodes on purpose —
# reclaiming pages from under shared_buffers produces latency cliffs that look
# like Postgres faults. The console can balloon freely.
autobase_guests:
  autobase-console:
    vmid: 8010
    cores: 2
    memory: 2048
    balloon: 512
    disk_gb: 32
    ip: 192.168.1.30
  pgnode01:
    vmid: 8001
    cores: 2
    memory: 2560
    balloon: 0
    disk_gb: 40
    ip: 192.168.1.41
  pgnode02:
    vmid: 8002
    cores: 2
    memory: 2560
    balloon: 0
    disk_gb: 40
    ip: 192.168.1.42
  pgnode03:
    vmid: 8003
    cores: 2
    memory: 2560
    balloon: 0
    disk_gb: 40
    ip: 192.168.1.43

# ----------------------------------------------------------------------------
# Cloud-init template (built once on tav-serv by roles/proxmox_template)
# ----------------------------------------------------------------------------
pve_template_vmid: 8000
pve_template_name: ubuntu2404-cloudinit
pve_image_cache_dir: /var/lib/vz/template/iso

# Ubuntu 24.04 LTS, not Rocky 10. RHEL 10 and its rebuilds require an x86-64-v3
# CPU baseline (AVX2/BMI2/FMA, Haswell and later). tav-serv is 2x X5670 —
# Westmere-EP, 2010, no AVX at all — so it tops out at x86-64-v2 and the Rocky 10
# kernel halts before it reaches a console, whatever --cpu type the VM gets.
# Ubuntu 24.04 runs on x86-64-v2, and Autobase's CI tests it daily.
#
# Verified present 2026-09-18. The `releases/` path is the published release
# artifact (currently the latest 24.04 point release).
guest_image_url: >-
  https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img

# ----------------------------------------------------------------------------
# Guest login. Autobase needs root or a NOPASSWD-sudo user over SSH; this is
# the account both our playbooks and the Console use.
# ----------------------------------------------------------------------------
autobase_ci_user: ansible

# Public half of the key the Console hands to Autobase. Injected by cloud-init.
# Generate on the control node, then paste the .pub here:
#   ssh-keygen -t ed25519 -f ./ssh_keys/autobase -C "autobase@tavares-lab"
autobase_ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOOfUTADdatrmUFwooEQVg8aBZlGyUPm85vxsxcY+BJ7 autobase@tavares-lab"

# ----------------------------------------------------------------------------
# Autobase Console
# ----------------------------------------------------------------------------
autobase_console_version: "2.11.0"
autobase_console_dir: /opt/autobase/console

# Serve the UI over the tailnet instead of exposing :80 to the LAN.
autobase_console_tailscale_serve: true

# ----------------------------------------------------------------------------
# Ports the cluster needs between DB nodes. Only enforced if you flip
# guest_firewall_enabled to true, in which case ufw restricts them to
# autobase_subnet_cidr. Add 5000-5003 and 7000 if you later enable HAProxy.
# ----------------------------------------------------------------------------
autobase_cluster_ports:
  - 5432    # PostgreSQL
  - 6432    # PgBouncer
  - 8008    # Patroni REST API
  - 2379    # etcd client
  - 2380    # etcd peer
