---
# Top-level playbook — the whole lab, in dependency order.
#
#   ansible-playbook site.yml --ask-vault-pass
#
# The Autobase plays read secrets from inventory/group_vars/all/all.vault.yml, so a full run
# needs the vault password. Slices:
#   --tags proxmox_host   tav-serv baseline only (packages, sysctl, smartd)
#   --tags tailscale      tailnet flags on the host
#   --tags template       the Ubuntu cloud-init template
#   --tags guests         clone / resize / start the platform VMs
#   --tags baseline       inside the guests
#   --tags console        Docker + Tailscale + the Autobase Console stack
#
# This used to be a single play applying base/monitoring/docker/virtualization/
# tailscale/user_env to tav-serv as a Mint box with VirtualBox guests. Those
# roles were retired with the Proxmox rebuild — see
# docs/context/design-decisions.md and `git log`.

- ansible.builtin.import_playbook: playbooks/proxmox-host.yml
- ansible.builtin.import_playbook: playbooks/autobase.yml
