---
# Docker CE. The apt repo is set up here rather than in a shared baseline role,
# so this role stands alone on any host that needs Docker. Today that is the
# Autobase console VM only — Docker is deliberately kept off the Proxmox host,
# where it would fight PVE over iptables and bridge management.

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: docker_enabled | default(true)
  tags: [docker, docker-repo]

- name: Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false
  when: docker_enabled | default(true)
  tags: [docker, docker-repo]

- name: Docker apt source
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ docker_apt_codename }}
      stable
    filename: docker
    state: present
    update_cache: true
  when: docker_enabled | default(true)
  tags: [docker, docker-repo]

- name: Install Docker CE and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: docker_enabled | default(true)
  tags: [docker]

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users | default([]) }}"
  tags: [docker]

- name: Enable + start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  tags: [docker]

- name: Ensure log-rotation for containers
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
  notify: restart docker
  tags: [docker]

# -------- Compose stacks --------
- name: Ensure per-stack directories
  ansible.builtin.file:
    path: "{{ item.value.compose_dir }}"
    state: directory
    owner: root
    group: docker
    mode: "0750"
  loop: "{{ docker_stacks | default({}) | dict2items }}"
  tags: [docker, stacks]

- name: Render compose files
  ansible.builtin.copy:
    dest: "{{ item.value.compose_dir }}/docker-compose.yml"
    content: "{{ item.value.compose_file }}"
    owner: root
    group: docker
    mode: "0640"
  loop: "{{ docker_stacks | default({}) | dict2items }}"
  register: compose_written
  tags: [docker, stacks]

- name: Apply compose stacks
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ item.value.compose_dir }}"
  loop: "{{ docker_stacks | default({}) | dict2items }}"
  changed_when: true
  tags: [docker, stacks]
