---
# libvirt / KVM
- name: Install libvirt + KVM stack
  ansible.builtin.apt:
    name:
      - qemu-kvm
      - libvirt-daemon-system
      - libvirt-clients
      - bridge-utils
      - virtinst
      - genisoimage
    state: present
  when: virtualization_libvirt_enabled | default(true)
  tags: [virtualization, libvirt]

- name: Add users to libvirt+kvm groups
  ansible.builtin.user:
    name: "{{ item }}"
    groups: libvirt,kvm
    append: true
  loop: "{{ docker_users | default([]) }}"
  when: virtualization_libvirt_enabled | default(true)
  tags: [virtualization, libvirt]

- name: Enable + start libvirtd
  ansible.builtin.systemd:
    name: libvirtd
    enabled: true
    state: started
  when: virtualization_libvirt_enabled | default(true)
  tags: [virtualization, libvirt]

# VirtualBox
- name: Install VirtualBox
  ansible.builtin.apt:
    name:
      - virtualbox
      - virtualbox-ext-pack
      - virtualbox-guest-utils
    state: present
  when: virtualization_vbox_enabled | default(true)
  tags: [virtualization, vbox]

- name: Add users to vboxusers group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: vboxusers
    append: true
  loop: "{{ docker_users | default([]) }}"
  when: virtualization_vbox_enabled | default(true)
  tags: [virtualization, vbox]

# -------- VM declarations (VirtualBox) --------
# Each VM in vbox_vms is created if it does not already exist.
# We do NOT touch existing VMs on subsequent runs — this role establishes
# the initial VM shape; further edits should be intentional and manual,
# or driven by a dedicated update-vm playbook.
- name: Check which VBox VMs already exist
  ansible.builtin.command: VBoxManage list vms
  register: vbox_existing
  changed_when: false
  when: vbox_vms is defined
  become_user: "{{ docker_users[0] }}"
  become: true
  tags: [virtualization, vbox, vms]

- name: Create VBox VM (if missing)
  ansible.builtin.command:
    cmd: >-
      VBoxManage createvm --name {{ item.key }}
      --ostype {{ item.value.ostype | default('Linux_64') }}
      --register
  loop: "{{ vbox_vms | default({}) | dict2items }}"
  when:
    - vbox_vms is defined
    - '"\"" ~ item.key ~ "\"" not in vbox_existing.stdout'
  changed_when: true
  become_user: "{{ docker_users[0] }}"
  become: true
  tags: [virtualization, vbox, vms]

- name: Configure VBox VM basics
  ansible.builtin.command:
    cmd: >-
      VBoxManage modifyvm {{ item.key }}
      --memory {{ item.value.memory }}
      --cpus {{ item.value.cpus }}
      --firmware {{ item.value.firmware | default('bios') }}
      --nic1 {{ item.value.nic }}
      {% if item.value.nic == 'bridged' %}--bridgeadapter1 {{ item.value.bridge_iface }}{% endif %}
      --graphicscontroller vmsvga --vram 16
      --vrde on
      --vrdeport {{ item.value.vrde_port | default(3389) }}
      --vrdeaddress {{ item.value.vrde_address | default('127.0.0.1') }}
  loop: "{{ vbox_vms | default({}) | dict2items }}"
  when:
    - vbox_vms is defined
    - '"\"" ~ item.key ~ "\"" not in vbox_existing.stdout'
  changed_when: true
  become_user: "{{ docker_users[0] }}"
  become: true
  tags: [virtualization, vbox, vms]
