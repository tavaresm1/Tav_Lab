---
- name: Install Cockpit and extras
  ansible.builtin.apt:
    name: "{{ ['cockpit'] + (cockpit_extras | default([])) }}"
    state: present
  when: cockpit_enabled | default(true)
  tags: [monitoring, cockpit]

- name: Enable + start Cockpit socket
  ansible.builtin.systemd:
    name: cockpit.socket
    enabled: true
    state: started
  when: cockpit_enabled | default(true)
  tags: [monitoring, cockpit]

# smartd for the megaraid disks
- name: Deploy smartd.conf
  ansible.builtin.copy:
    dest: /etc/smartd.conf
    mode: "0644"
    content: |
      # Managed by Ansible. Do not edit by hand.
      DEVICESCAN -d removable -n standby -m root -M exec /usr/share/smartmontools/smartd-runner
      /dev/sda -d megaraid,0 -a -o on -S on -s (S/../.././02|L/../../6/03) -m root
      /dev/sda -d megaraid,1 -a -o on -S on -s (S/../.././02|L/../../6/03) -m root
  notify: restart smartd
  tags: [monitoring, smart]

- name: Enable + start smartd
  ansible.builtin.systemd:
    name: smartd
    enabled: true
    state: started
  tags: [monitoring, smart]
