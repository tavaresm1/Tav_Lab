---
# Tailscale. The apt repo is set up here rather than in a shared base role so
# this works on both families in play: Debian on tav-serv, Ubuntu on the guests.
- name: Tailscale keyring
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ tailscale_apt_distro }}/{{ tailscale_apt_codename }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"
    force: false
  when: tailscale_enabled | default(true)
  tags: [tailscale, net, tailscale-repo]

- name: Tailscale apt source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ tailscale_apt_distro }} {{ tailscale_apt_codename }} main
  when: tailscale_enabled | default(true)
  tags: [tailscale, net, tailscale-repo]

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  when: tailscale_enabled | default(true)
  tags: [tailscale, net]

- name: Enable + start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  when: tailscale_enabled | default(true)
  tags: [tailscale, net]

# We only run `tailscale up` if the node is NOT already logged in.
# Re-running it with different flags is legal but noisy — prefer `tailscale set`
# for flag drift, which we do below.
#
# check_mode: false because this is a read-only query and the two tasks below
# branch on its output. Without it, `--check` skips this task, ts_status.stdout is
# undefined, and BOTH the login and the flag-drift task skip too — so a dry run
# reports nothing to do for Tailscale whether or not the flags actually drifted.
# That is worse than useless: it hid the pending --advertise-routes change.
- name: Detect tailscale login state
  ansible.builtin.command: tailscale status --json
  register: ts_status
  changed_when: false
  failed_when: false
  check_mode: false
  when: tailscale_enabled | default(true)
  tags: [tailscale]

# An auth key makes the first login non-interactive, which is what unattended
# guests need.
#
# Wrapped in block/rescue because no_log turns any failure here into
# `"censored": "the output has been hidden..."` — the key is protected, and so is
# the reason the login failed. That is a dead end: the operator is told only that
# something went wrong with a task whose whole output is a secret. The rescue
# cannot print the real stderr (it is censored at the task level, not here), so it
# prints the differential diagnosis instead, which is nearly as useful because the
# failure modes are few and distinguishable by timing.
- name: Bring tailscale up (first-time login)
  when:
    - tailscale_enabled | default(true)
    - ts_status.stdout is defined
    - '"NeedsLogin" in ts_status.stdout or "NoState" in ts_status.stdout'
  tags: [tailscale]
  block:
    - name: tailscale up
      ansible.builtin.command: >-
        tailscale up {{ tailscale_up_flags | join(' ') }}
        {{ ('--auth-key=' ~ tailscale_authkey) if (tailscale_authkey | default('') | length > 0) else '' }}
      changed_when: true
      # no_log is conditional so hosts logging in by hand still show their output —
      # nothing is hidden unless there is actually a key to hide.
      no_log: "{{ (tailscale_authkey | default('') | length) > 0 }}"
      # With no usable key, `tailscale up` does not fail — it prints a login URL and
      # BLOCKS until a human visits it. Under Ansible that is an indefinite hang,
      # the worst failure mode for an unattended run. A preflight assert on the key
      # would be the wrong guard: a host already logged in legitimately needs no
      # key, so asserting would block every re-run after the first. Capping the task
      # is correct either way — a keyed login takes under a second, so 120s only
      # ever expires on the hang.
      timeout: 120

  rescue:
    - name: Explain the failed login without leaking the key
      ansible.builtin.fail:
        msg: >-
          `tailscale up` failed on {{ inventory_hostname }} and its output is
          censored by no_log, because the command line carries the auth key. Read
          the elapsed time in the TASKS RECAP to tell the two cases apart. UNDER A
          FEW SECONDS means the key was rejected — almost always expired (keys cap
          at 90 days) or single-use and already consumed by an earlier host or an
          earlier run of this play. AROUND 120 SECONDS means the timeout above
          fired, so no key reached the command at all and it sat waiting for an
          interactive login; check that vault_tailscale_authkey is actually set.
          Either way the fix is one of two things. Generate a fresh key in the
          Tailscale admin console under Settings - Keys, mark it REUSABLE so this
          cannot recur, and put it in the vault as vault_tailscale_authkey. Or skip
          the key entirely and log this host in by hand, once:
          `sudo tailscale up {{ tailscale_up_flags | join(' ') }}` then open the
          printed URL. After a manual login this task stops running altogether —
          the role detects the logged-in state and switches to `tailscale set` for
          flag drift, which needs no key ever again.

# `--check` cannot preview either of the two tasks above: ansible.builtin.command
# is not check-mode capable, so Ansible skips it rather than guess at the effect.
# check_mode: false on the read-only query above is not enough to change that. So
# read the current prefs and print the comparison ourselves — otherwise a dry run
# is silent about Tailscale and you find out what changed only after applying.
- name: Read current tailscale prefs
  ansible.builtin.command: tailscale debug prefs
  register: ts_prefs
  changed_when: false
  failed_when: false
  check_mode: false
  when: tailscale_enabled | default(true)
  tags: [tailscale]

- name: Report what tailscale set would apply
  ansible.builtin.debug:
    msg:
      - "desired flags: {{ tailscale_up_flags | join(' ') }}"
      - "current AdvertiseRoutes: {{ (ts_prefs.stdout | from_json).AdvertiseRoutes | default('none') }}"
      - "current RouteAll (--accept-routes): {{ (ts_prefs.stdout | from_json).RouteAll | default(false) }}"
      - "current RunSSH (--ssh): {{ (ts_prefs.stdout | from_json).RunSSH | default(false) }}"
      - "current Hostname: {{ (ts_prefs.stdout | from_json).Hostname | default('(default)') }}"
  when:
    - tailscale_enabled | default(true)
    - ts_prefs.stdout is defined
    - ts_prefs.stdout | length > 0
  tags: [tailscale]

# Always runs when logged in: `tailscale set` is itself idempotent and cheap, but
# that means this task reports "changed" on every run. Comparing tailscale_up_flags
# (a free-form flag list) against the structured prefs JSON to derive a real
# changed_when would mean reshaping the flag model — not worth it for cosmetics.
# The task above is where you look to see whether anything actually differs.
- name: Apply tailscale flag drift (set)
  ansible.builtin.command: "tailscale set {{ tailscale_up_flags | join(' ') }}"
  when:
    - tailscale_enabled | default(true)
    - ts_status.stdout is defined
    - '"NeedsLogin" not in ts_status.stdout'
    - '"NoState" not in ts_status.stdout'
  changed_when: true
  tags: [tailscale]
