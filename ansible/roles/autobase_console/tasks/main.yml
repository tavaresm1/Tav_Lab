---
# The Autobase Console stack: console_ui, console_api, console_db and
# dbdesk-studio, plus the sibling autobase/automation containers the API spawns
# through the Docker socket.
#
# Deliberate deviation from the repo's docker_stacks convention (inline compose
# strings in host_vars): this is a 4-service file that upstream maintains and
# version-bumps, so vendoring it inline means hand-merging every release.
# Fetching it at a pinned tag keeps upgrades to an autobase_console_version
# change. docs/context/design-decisions.md already anticipates the split at the
# ~5-10 stack mark.

- name: Ensure the console directory exists
  ansible.builtin.file:
    path: "{{ autobase_console_dir }}"
    state: directory
    owner: root
    group: docker
    mode: "0750"
  tags: [console]

- name: Fetch the pinned upstream compose file
  ansible.builtin.get_url:
    url: >-
      https://raw.githubusercontent.com/autobase-tech/autobase/{{ autobase_console_version }}/console/docker-compose.yml
    dest: "{{ autobase_console_dir }}/docker-compose.yml"
    owner: root
    group: docker
    mode: "0640"
    force: true
  register: autobase_compose
  tags: [console]

- name: Write the console .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ autobase_console_dir }}/.env"
    owner: root
    group: docker
    mode: "0640"
  register: autobase_env
  no_log: true
  tags: [console]

- name: Bring the console stack up
  community.docker.docker_compose_v2:
    project_src: "{{ autobase_console_dir }}"
    state: present
    pull: missing
    remove_orphans: true
  register: autobase_stack
  tags: [console]

- name: Wait for the Console UI to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:80/"
    status_code: [200, 301, 302]
  register: autobase_ui
  retries: 30
  delay: 5
  until: autobase_ui is succeeded
  tags: [console]

# Serve the UI over the tailnet rather than exposing :80 on the LAN. Tailscale
# terminates TLS with a cert for the tailnet name, so there is no Caddy variant
# and no public DNS record to maintain.
- name: Check existing tailscale serve config
  ansible.builtin.command: tailscale serve status
  register: ts_serve
  changed_when: false
  failed_when: false
  when: autobase_console_tailscale_serve | default(false)
  tags: [console, net]

# Capped and rescued for the same reason as roles/tailscale's first-time login:
# `tailscale serve --bg` normally returns in milliseconds, but it blocks
# indefinitely when the tailnet cannot issue a certificate for --https=443,
# because the CLI stops to ask rather than failing. Under Ansible that is a silent
# hang with the play's last useful output already scrolled past. 60s is generous
# for a command whose successful form is instant.
#
# This is the LAST task that does anything, so a failure here costs nothing that
# matters: the stack is up and the UI has already answered on :80 by the time we
# get here. Hence a rescue that explains and continues rather than one that fails.
- name: Publish the Console over tailscale serve
  when:
    - autobase_console_tailscale_serve | default(false)
    - ts_serve.stdout is defined
    - "'127.0.0.1:80' not in ts_serve.stdout"
  tags: [console, net]
  block:
    - name: tailscale serve
      ansible.builtin.command: tailscale serve --bg --https=443 http://127.0.0.1:80
      changed_when: true
      timeout: 60

  rescue:
    - name: Explain the tailnet publish failure and carry on
      ansible.builtin.debug:
        msg: >-
          `tailscale serve --https=443` did not succeed on {{ inventory_hostname }},
          so the Console is NOT published on the tailnet. It is still fully working
          on the LAN at http://{{ autobase_guests[inventory_hostname].ip }}/ — this
          step only adds a TLS front door, so nothing else is affected and the
          cluster build can proceed. The usual cause is that HTTPS certificates are
          not enabled for the tailnet: Tailscale needs them to issue a cert for the
          node's MagicDNS name, and the CLI blocks asking rather than failing, which
          is why this task was capped at 60s. Enable it in the admin console under
          DNS, then re-run with `--tags console`. Run the command by hand to see the
          real message: `sudo tailscale serve --bg --https=443 http://127.0.0.1:80`.
          To stop attempting this entirely, set autobase_console_tailscale_serve to
          false in inventory/group_vars/autobase_console.yml.

# The LAN address is stated first and unconditionally because it is the one this
# role actually verified: the `uri` task above proved :80 answers. The tailnet URL
# is only offered when `tailscale serve` is configured for it, since printing a URL
# that does not resolve is worse than printing none — it sends you debugging DNS
# when the truth is that the publish step never ran or was rescued.
- name: Report how to reach the Console
  ansible.builtin.debug:
    msg: >-
      Console up at http://{{ autobase_guests[inventory_hostname].ip }}/ — sign in
      with the AUTH_TOKEN from inventory/group_vars/all/all.vault.yml.
      {{ 'Also published on the tailnet at https://autobase.'
         if (autobase_console_tailscale_serve | default(false))
            and (ts_serve.stdout is defined)
         else 'Not published on the tailnet.' }}
  tags: [console]
