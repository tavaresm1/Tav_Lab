---
# The Console VM. Runs the 4-service Autobase stack plus the sibling
# autobase/automation containers it spawns through the Docker socket.

# Ports to open if guest_firewall_enabled is turned on for this group.
guest_firewall_tcp_ports:
  - 80
  - 443

# Left at the image default (enabled) — this host is not a database, and a
# console that quietly falls behind on security updates is worse than one that
# restarts a container overnight.
guest_unattended_upgrades: true

# --- Overrides for the shared roles --------------------------------------
# group_vars/all.yml defines no docker_users at all, and its tailscale_up_flags
# are written for tav-serv:
#
#   tailscale_up_flags: [--ssh, --advertise-routes=192.168.0.0/24,
#                        --accept-routes]
#                              -> a DB console has no business advertising the
#                                 LAN subnet; tav-serv is the subnet router.
docker_users:
  - "{{ autobase_ci_user }}"

tailscale_up_flags:
  - --ssh
  - --hostname=autobase

# Non-interactive join. Put the key in group_vars/all.vault.yml as
# vault_tailscale_authkey; roles/tailscale hides the task under no_log whenever
# this is non-empty. Leave it empty to log in by hand instead.
tailscale_authkey: "{{ vault_tailscale_authkey | default('') }}"
