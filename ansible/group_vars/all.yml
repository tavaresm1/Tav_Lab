---
# Global, non-secret defaults for every host.
#
# This file used to carry the Mint-era package sets (base_packages,
# hardware_packages, cleanup_packages, cockpit_extras, virtualization_*) for
# tav-serv when it was a Linux Mint box. Those went with the roles that consumed
# them; host utilities now live in roles/proxmox_host/defaults, guest packages in
# group_vars/autobase_guests.yml. `git log` has the originals.

timezone: America/New_York
locale: en_US.UTF-8

# Docker. Only the Autobase console VM gets it — deliberately NOT the hypervisor,
# where Docker's iptables and bridge management would fight PVE's. The console
# overrides docker_users in group_vars/autobase_console.yml.
docker_enabled: true

# Tailscale. These flags are written for tav-serv, which is the tailnet subnet
# router for the lab LAN — that is what makes iDRAC, the PVE UI and the Autobase
# guests reachable from anywhere on the tailnet. The route needs one-time approval
# in the Tailscale admin console.
# Guests must NOT inherit this; autobase_console.yml overrides it.
#
# The LAN is 192.168.1.0/24 — tav-serv is 192.168.1.226. Earlier revisions of this
# repo said 192.168.0.0/24; that was wrong and advertising it would have routed
# nothing.
tailscale_enabled: true
tailscale_up_flags:
  - --ssh
  - --advertise-routes=192.168.1.0/24
  - --accept-routes
