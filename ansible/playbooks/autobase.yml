---
# Autobase platform on tav-serv, the Proxmox host. Runbook: docs/autobase.md
#
#   ansible-playbook playbooks/autobase.yml --ask-vault-pass
#
# Slices:
#   --tags template   build the Ubuntu 24.04 cloud-init template only
#   --tags guests     clone / resize / start the four VMs
#   --tags baseline   packages, hostnames, sudo (and ufw, if enabled) on the guests
#   --tags console    Docker + Tailscale + the Console stack
#
# Add `--limit tav-serv` to the template and guests slices:
#
#   ansible-playbook playbooks/autobase.yml --tags template --limit tav-serv
#   ansible-playbook playbooks/autobase.yml --tags guests   --limit tav-serv
#
# Without it, those runs end in `unreachable=1` for all four guests and the
# playbook exits 4 even on complete success. The cause is not tag filtering being
# ignored — it is that a play with `gather_facts: true` gathers facts even when
# tag filtering has excluded every one of its tasks, so the baseline and console
# plays try to SSH to VMs that do not exist yet. Both of those slices do all their
# work on the hypervisor (the guests slice talks to the PVE API and delegates to
# localhost), so limiting to tav-serv loses nothing and makes a clean run exit 0 —
# which matters the moment anything checks the exit code.
#
# If you do run without --limit, read the tav-serv line of the PLAY RECAP; it is
# the only one reporting on work that was in scope.
#
# This playbook stops at prepared guests on purpose. The Postgres clusters
# themselves are created from the Console UI (or the vitabaks.autobase
# collection) — that is Autobase's job, not ours.

- name: Preflight checks on tav-serv
  hosts: proxmox
  become: true
  gather_facts: true
  tags: always

  tasks:
    - name: Require the Step 0 discovery values to have been confirmed
      ansible.builtin.assert:
        that: autobase_preflight_confirmed | bool
        fail_msg: >-
          inventory/group_vars/autobase.yml still holds placeholder values. Work through
          docs/autobase.md §1, correct pve_node / pve_storage / pve_bridge, the
          subnet and every IP, then set autobase_preflight_confirmed: true.

    - name: Require an SSH public key for the guests
      ansible.builtin.assert:
        that: "'REPLACE_ME' not in autobase_ssh_pubkey"
        fail_msg: >-
          autobase_ssh_pubkey is still the placeholder. Generate the pair
          (ssh-keygen -t ed25519 -f ./ssh_keys/autobase) and paste the .pub
          into inventory/group_vars/autobase.yml — cloud-init injects it, and it is the
          key you hand the Console later.

    - name: Require the vault secrets
      ansible.builtin.assert:
        that:
          - vault_proxmox_api_token_secret | default('') | length > 0
          - vault_autobase_auth_token | default('') | length > 0
        fail_msg: >-
          Missing secrets. These variables are undefined, which means EITHER the
          vault does not define them OR the vault is not being loaded — and the
          second is far more likely, because it fails silently. Check in order:
          (1) does inventory/group_vars/all/ contain a *.vault.yml file? The
          container installs it there from the control-node/vault/ mount; look for
          "[entrypoint] vault: installed" in the run output. (2) Is it in
          group_vars/all/ and not group_vars/ itself? A file at
          group_vars/all.vault.yml is NEVER loaded: the loader matches basenames
          against group names, and "all.vault" is not a group. Inside the all/
          directory any filename works. (3) Only then, check the contents with
          ansible-vault view. See control-node/README.md step 2b.

    - name: Confirm the requested storage exists on this node
      ansible.builtin.command: "pvesm status --storage {{ pve_storage }}"
      register: pve_storage_check
      changed_when: false
      failed_when: pve_storage_check.rc != 0

    # Autobase validates this itself at deploy time, but finding out now beats
    # finding out ten minutes into a cluster build.
    - name: Confirm the cluster VIP is unused
      ansible.builtin.command: "ping -c 2 -W 1 {{ autobase_cluster_vip }}"
      register: vip_ping
      changed_when: false
      failed_when: false

    - name: Fail if something already answers on the VIP
      ansible.builtin.assert:
        that: vip_ping.rc != 0
        fail_msg: >-
          {{ autobase_cluster_vip }} answers ping, so it is not free.
          vip-manager needs an address nothing else owns, and it must sit
          outside the DHCP pool. Pick another and update autobase_cluster_vip.

    - name: Report free memory against the platform's budget
      ansible.builtin.debug:
        msg: >-
          tav-serv has {{ ansible_memfree_mb }} MB free of {{ ansible_memtotal_mb }} MB.
          This platform wants
          {{ autobase_guests.values() | map(attribute='memory') | sum }} MB resident.

- name: Build the Ubuntu cloud-init template
  hosts: proxmox
  become: true
  gather_facts: false
  roles:
    - { role: proxmox_template, tags: [template] }

- name: Provision the Autobase guests
  hosts: proxmox
  become: true
  gather_facts: false
  roles:
    - { role: proxmox_guests, tags: [guests] }

- name: Baseline the Ubuntu guests
  hosts: autobase_guests
  become: true
  gather_facts: true
  roles:
    - { role: guest_baseline, tags: [baseline] }

- name: Deploy the Autobase Console
  hosts: autobase_console
  become: true
  gather_facts: true
  roles:
    - { role: docker, tags: [console, docker] }
    - { role: tailscale, tags: [console, net] }
    - { role: autobase_console, tags: [console] }
